name: Update public CS2 skin prices

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: skinport-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check requests brotli
      - name: Read Skinport public listing prices
        run: python scripts/update_prices.py
      - name: Commit updated public prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public CS2 skin price cache"
            git push
          fi
