name: Generate social preview image
on:
  workflow_dispatch:
  push:
    paths:
      - "og-draft.svg"
      - "scripts/render_og.py"
      - ".github/workflows/social-preview.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: python -m pip install cairosvg
      - name: Generate PNG
        run: python scripts/render_og.py
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-cover.png
          if ! git diff --cached --quiet; then
            git commit -m "Render social preview image"
            git push
          fi
